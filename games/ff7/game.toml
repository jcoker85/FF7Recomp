# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "Final Fantasy VII"
id = "SCUS-94163"
players = 2
exe = "disc/SCUS_941.63"
# One program on three images: Disc 1 boots, Discs 2 and 3 are data. This list
# is the runtime's disc roster (the launcher's disc dropdown and the in-game
# Ctrl+L / F10 disc menu), and a disc change mounts the listed file itself, so
# the player puts their own images here, next to the executable, under these
# names. tools/generate.sh is given the Disc 1 path directly.
discs = [
    "discs/Disc 1.chd",
    "discs/Disc 2.chd",
    "discs/Disc 3.chd",
]
disc_serials = [
    "SCUS-94163",
    "SCUS-94164",
    "SCUS-94165",
]
load_address = "0x80010000"
entry_pc = "0x800110C0"
text_size = "0x00060800"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Final Fantasy VII - Disc 1.bin"
cue_name = "Final Fantasy VII - Disc 1.cue"
boot_exe = "SCUS_941.63"
known_sizes = [747435024]
known_md5 = [
  "cce4e76d020b47847fe8e2f81ff613db",
]
known_sha1 = [
  "1f890164ac4daeba07def64bb5b636bfaa1d3ab9",
]
known_crc32 = [
  "1459cbef",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "Final Fantasy VII Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"
# Texture filtering (bilinear / xBR) smooths polygons only. Field screens are
# built from 16x16 background tiles in layers, and the base layer hides a pure
# green filler under the foreground layer; filtering the tiles would bleed that
# green into the picture as outlines. Tiles, sprites and text stay sharp.
filter_rectangles = false

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "23f1f7ab6a5327016a16783978fe49f94fb67814f4689f3c187612ece77418a3"

# Steady 30 FPS (mods: ff7.enhancement.steady-30, mods/src/ff7_steady30.c).
# The field main loop ends each frame with VSync(n) at 0x800A2A68, n = 2 in
# most scenes and 3 in a few. On the PlayStation's CPU a field frame took about
# two vblanks either way (30 fps), and more in busy scenes, when the game also
# slowed down: its logic runs once per frame. Measured with the CPU at 4x:
# VSync(2) gives 60 fps, VSync(3) 40 and VSync(4) a steady 30. Variant 1 turns
# both choices into VSync(4), and the 4x CPU scale applies only while that mod
# holds its gate open AND FIELD.BIN is the module at 0x800A0000 (its word at
# 0x800A1FF8), so a frame never needs more than its two vblanks. Without the
# mod both are off.
[mod_immediate]
sites = [
  { address = "0x800A2A4C", expected = "0x34040002", group = 1, values = [4] },  # ori a0, zero, 2: VSync(2)
  { address = "0x800A2A64", expected = "0x34040003", group = 1, values = [4] },  # ori a0, zero, 3: VSync(3)
]

[timing]
guest_cycle_scale = 4
guest_cycle_scale_gated = true
guest_cycle_scale_gate = [
  { addr = 0x800A1FF8, value = 0x34040001 },
]
